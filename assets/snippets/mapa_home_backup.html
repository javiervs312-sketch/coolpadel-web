<!--
  BACKUP MAPA INTERACTIVO DE CLUBS COOLPADEL
  Guardado para recuperación futura.
-->

<!-- HTML SECTION DEL MAPA -->
<section id="mapa-clubs" class="py-6 sm:py-8 lg:py-10 bg-slate-50 relative border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 sm:px-6">
    <div class="text-center max-w-2xl mx-auto mb-3 sm:mb-4 space-y-1">
      <h3 class="text-lg sm:text-2xl font-black font-heading text-slate-950 uppercase tracking-tight">
        Clubs y Marcas con Llaveros CoolPadel
      </h3>
      <p class="text-xs sm:text-sm text-slate-600 font-medium">
        Selecciona una zona o haz clic en cualquier marcador para explorar nuestros clubs oficiales
      </p>
    </div>

    <div class="bg-white rounded-2xl p-3 sm:p-5 border border-slate-200/90 shadow-md">
      <!-- FILTROS POR REGIÓN -->
      <div class="flex items-center justify-center gap-1 sm:gap-2 flex-wrap pb-2.5 sm:pb-3 border-b border-slate-100" id="map-filter-bar">
        <button type="button" onclick="focusMapRegion('all')" class="map-filter-btn px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition cursor-pointer bg-slate-950 text-white shadow-xs" data-region="all">Todos (27)</button>
        <button type="button" onclick="focusMapRegion('es')" class="map-filter-btn px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-700 hover:bg-slate-200" data-region="es">España (15)</button>
        <button type="button" onclick="focusMapRegion('it')" class="map-filter-btn px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-700 hover:bg-slate-200" data-region="it">Italia (5)</button>
        <button type="button" onclick="focusMapRegion('fr')" class="map-filter-btn px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-700 hover:bg-slate-200" data-region="fr">Francia (3)</button>
        <button type="button" onclick="focusMapRegion('be')" class="map-filter-btn px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-700 hover:bg-slate-200" data-region="be">Bélgica (2)</button>
        <button type="button" onclick="focusMapRegion('other')" class="map-filter-btn px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition cursor-pointer bg-slate-100 text-slate-700 hover:bg-slate-200" data-region="other">Austria & Dinamarca (2)</button>
      </div>

      <!-- GRID INTERACTIVO -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch pt-2 sm:pt-3">
        <div class="lg:col-span-8 relative bg-slate-100 rounded-xl border border-slate-200/90 overflow-hidden shadow-inner min-h-[340px] sm:min-h-[360px] h-[340px] sm:h-[360px]">
          <div id="coolpadel-leaflet-map" class="w-full h-full min-h-[340px] sm:min-h-[360px] z-10" style="min-height: 360px; height: 360px; width: 100%; background: #e2e8f0;"></div>
          <div id="map-scroll-hint" class="absolute inset-0 z-[500] bg-slate-950/60 backdrop-blur-xs flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
            <div class="bg-slate-900/95 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-xl border border-slate-700/80 flex items-center gap-2">
              <i data-lucide="info" class="w-4 h-4 text-[#f2920b]"></i>
              <span>Usa Ctrl + desplazamiento para hacer zoom en el mapa</span>
            </div>
          </div>
          <div class="absolute bottom-2.5 left-2.5 z-[400] bg-white/95 backdrop-blur-sm px-3 py-1 rounded-full border border-slate-200/90 shadow-xs pointer-events-none hidden sm:flex items-center gap-1.5 text-[10px] font-bold text-slate-700">
            <i data-lucide="hand" class="w-3 h-3 text-[#f2920b]"></i>
            <span>Arrastra para mover el mapa · Ctrl + rueda para zoom</span>
          </div>
        </div>

        <div class="lg:col-span-4 flex flex-col justify-center items-center bg-white rounded-xl p-3 sm:p-4 border border-slate-200 min-h-[340px] sm:min-h-[360px] shadow-xs text-center" id="club-info-card">
          <div class="w-full flex-1 flex flex-col items-center justify-center p-4 bg-slate-50/70 rounded-xl border border-slate-200/80">
            <div class="h-28 sm:h-32 w-full flex items-center justify-center">
              <img id="club-logo-img" src="assets/images/Clubs/client-02.png" alt="Logo Club de Tenis Cambados" width="200" height="140" loading="lazy" decoding="async" class="max-h-24 sm:max-h-28 max-w-[180px] w-auto h-auto object-contain transition-all duration-300">
            </div>
            <div class="mt-3 space-y-0.5 text-center">
              <h4 id="club-name" class="font-heading font-black text-base sm:text-lg text-slate-950">Club de Tenis Cambados</h4>
              <p id="club-location" class="text-[11px] sm:text-xs font-bold text-slate-500">Cambados, Galicia (España)</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
